<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tlog</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Only macOS draws its window buttons inside the page; everywhere else
         the window manager owns the frame and the band would be dead space. -->
    <script>
      if (/Mac/.test(navigator.platform)) document.documentElement.classList.add("mac");
      // Set before the first paint, so a sidebar left collapsed does not slide
      // shut every time the window opens.
      try {
        if (localStorage.getItem("sidebar") === "collapsed")
          document.documentElement.classList.add("sidebar-collapsed");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="titlebar"></div>

    <div id="layout">
      <aside id="sidebar">
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
        <div id="results" hidden></div>

        <nav id="nav">
          <button id="today" class="navitem"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Today</span></button>
          <button id="agendabtn" class="navitem"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8M13 12h8M13 18h8"/></svg><span>Agenda</span></button>

          <details open>
            <summary>Journals</summary>
            <ul id="journals"></ul>
          </details>
          <details open>
            <summary>Pages</summary>
            <ul id="pages"></ul>
          </details>
          <details>
            <summary>Tags</summary>
            <ul id="tags"></ul>
          </details>
        </nav>

        <footer id="root" title="Your notes live here">
          <span id="rootpath"></span>
          <button id="gear" title="Settings (⌘,)" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </footer>
      </aside>

      <main id="main">
        <header id="pagehead">
          <button id="sidebartoggle" title="Toggle sidebar (⌘\)" aria-label="Toggle sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg></button>
          <div id="histnav">
            <button id="back" title="Back (⌘[)" aria-label="Back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
            <button id="fwd" title="Forward (⌘])" aria-label="Forward"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
          </div>
          <h1 id="title"></h1>
          <div id="daynav">
            <button id="prev" title="Previous day (⌥⌘←)" aria-label="Previous day"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
            <button id="next" title="Next day (⌥⌘→)" aria-label="Next day"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
          </div>
          <div id="pagetags"></div>
        </header>

        <section id="outline"></section>

        <section id="agenda" hidden>
          <ul id="agendalist"></ul>
        </section>

        <section id="tagged" hidden>
          <h2 id="taggedhead"></h2>
          <ul id="taggedlist"></ul>
        </section>

        <section id="refs" hidden>
          <h2 id="refshead"></h2>
          <div id="reflist"></div>
        </section>
      </main>
    </div>

    <div id="settings" hidden>
      <div class="sheet">
        <header><h2>Settings</h2><button id="closesettings">Done</button></header>
        <div id="settingslist"></div>
        <footer id="settingspath"></footer>
      </div>
    </div>

    <div id="palette" hidden>
      <div class="sheet">
        <input id="palettequery" type="text" placeholder="Go to a journal, page or tag"
               autocomplete="off" spellcheck="false" />
        <ul id="palettelist"></ul>
      </div>
    </div>

    <div id="help" hidden>
      <div class="sheet">
        <header><h2>Keyboard</h2><button id="closehelp">Done</button></header>
        <div id="helplist"></div>
      </div>
    </div>

    <div id="log" hidden>
      <div class="sheet">
        <header><h2>Messages</h2><button id="closelog">Done</button></header>
        <ul id="loglist"></ul>
      </div>
    </div>

    <div id="file" hidden>
      <div class="sheet">
        <header>
          <div class="filename"><h2 id="filename"></h2><span id="filepath" class="hint"></span></div>
          <div class="filebuttons">
            <button id="fileoutside" title="Open it in whatever the system opens this kind of file with">Open outside</button>
            <button id="closefile">Done</button>
          </div>
        </header>
        <pre id="filetext"></pre>
      </div>
    </div>

    <div id="complete" hidden></div>
    <div id="error" hidden title="Click to see everything tlog has said"></div>

    <script src="app.js"></script>
  </body>
</html>
